<title>III Sem Mech Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Canon notes app (Notion + Apple Books): quiet sidebar, one centred reading column (~70ch), properties block for tracker, on-this-page list at wide widths, floating timer pill while a stopwatch runs. */
:root{
  --bg:#ffffff; --side:#f7f7f5; --raise:#ffffff; --fg:#37352f; --fg2:#55534e; --muted:#73726e; --line:#e9e9e7; --hover:#efefed; --press:#e3e3e0;
  --accent:#1f6fc5; --accent-ink:#ffffff;
  --t-gray:#f1f1ef; --t-blue:#e7f3f8; --t-green:#edf3ec; --t-yellow:#fbf3db; --t-red:#fdebec; --t-orange:#fbecdd; --t-purple:#f4f0f8;
  --i-blue:#1f6fc5; --i-green:#2f7a52; --i-yellow:#8a6410; --i-red:#b8382f; --i-orange:#a85417; --i-purple:#7a4bb0;
  --sm:#3a7bd5; --te:#d4573f; --mse:#2f9480; --mt:#b07d24;
  --shadow:0 1px 2px rgba(15,15,15,.06),0 6px 20px rgba(15,15,15,.10);
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",ui-sans-serif,Helvetica,Arial,sans-serif;
  --f-serif:"New York",ui-serif,Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --f-read:var(--f-ui);
  --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --side:#202020; --raise:#232323; --fg:#e8e7e4; --fg2:#c4c3bf; --muted:#9b9a96; --line:#2f2f2f; --hover:#2a2a2a; --press:#333333;
  --accent:#5ea2e6; --accent-ink:#0f1720;
  --t-gray:#252525; --t-blue:#1b2a35; --t-green:#1d2c23; --t-yellow:#302816; --t-red:#36201f; --t-orange:#33261a; --t-purple:#2a2333;
  --i-blue:#6aaee8; --i-green:#71c08f; --i-yellow:#e2bd5c; --i-red:#f08a80; --i-orange:#eba06a; --i-purple:#bb9be6;
  --sm:#6aaee8; --te:#f08a7e; --mse:#5fc4ad; --mt:#d9b062;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --raise:#232323; --fg:#e8e7e4; --fg2:#c4c3bf; --muted:#9b9a96; --line:#2f2f2f; --hover:#2a2a2a; --press:#333333;
  --accent:#5ea2e6; --accent-ink:#0f1720;
  --t-gray:#252525; --t-blue:#1b2a35; --t-green:#1d2c23; --t-yellow:#302816; --t-red:#36201f; --t-orange:#33261a; --t-purple:#2a2333;
  --i-blue:#6aaee8; --i-green:#71c08f; --i-yellow:#e2bd5c; --i-red:#f08a80; --i-orange:#eba06a; --i-purple:#bb9be6;
  --sm:#6aaee8; --te:#f08a7e; --mse:#5fc4ad; --mt:#d9b062;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:64px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--press) transparent}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
input,textarea{caret-color:var(--accent)}
.ico{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:14px;height:14px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:10px 8px 28px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(8px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:8px;padding:8px 10px 14px;font-weight:650;font-size:15px;color:var(--fg);text-decoration:none}
.brand .logo{width:24px;height:24px;border-radius:6px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.brand .logo svg{width:15px;height:15px}
.nav-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;color:var(--fg2);text-decoration:none;font-size:14px;line-height:1.35;min-height:30px}
.nav-item:hover{background:var(--hover)}
.nav-item.cur{background:var(--press);color:var(--fg);font-weight:600}
.nav-group{margin-top:14px}
.nav-head{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;text-align:left}
.nav-head:hover{background:var(--hover)}
.nav-head .chev{transition:transform .18s ease-out}
.nav-group.closed .chev{transform:rotate(-90deg)}
.nav-group.closed .nav-units{display:none}
.nav-head .cnt{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.nav-units .nav-item{padding-left:12px}
.st{width:16px;height:16px;flex:0 0 auto}
.st circle{fill:none;stroke:var(--muted);stroke-width:1.5}
.st .part{fill:var(--accent);stroke:none}
.st.done circle{fill:var(--i-green);stroke:var(--i-green)}
.st.done path{stroke:var(--bg);stroke-width:2;fill:none}
.st.late circle{stroke:var(--i-red)}
.nav-units .u{color:var(--muted);font-variant-numeric:tabular-nums;width:20px;flex:0 0 auto;font-size:12.5px}
.side-foot{margin-top:18px;padding:10px;font-size:12px;color:var(--muted);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;height:46px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs a{text-decoration:none;color:var(--muted);padding:2px 6px;border-radius:5px}
.crumbs a:hover{background:var(--hover);color:var(--fg)}
.crumbs .here{color:var(--fg);overflow:hidden;text-overflow:ellipsis;padding:2px 6px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--fg2);font-size:14px}
.ibtn:hover{background:var(--hover);color:var(--fg)}
.ibtn[aria-expanded="true"]{background:var(--press)}
.menu-btn{display:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:0 6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--i-green)} .sync.warn i{background:var(--i-yellow)}

/* Aa popover */
.pop{position:fixed;z-index:40;top:calc(50px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:264px;background:var(--raise);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;font-size:14px}
.pop .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px}
.pop .lab{color:var(--fg2)}
.seg{display:inline-flex;background:var(--t-gray);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:3px 10px;border-radius:5px;cursor:pointer;color:var(--fg2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.switch{width:34px;height:20px;border-radius:999px;background:var(--press);border:0;position:relative;cursor:pointer;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .16s ease-out}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* page + toc */
.page-wrap{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;padding:28px max(20px,env(safe-area-inset-right,0px)) 120px max(20px,env(safe-area-inset-left,0px))}
.page{width:100%;max-width:740px;min-width:0}
.toc{display:none}
@media (min-width:1320px){
  .page-wrap{grid-template-columns:minmax(0,1fr) 220px;gap:40px;justify-items:stretch}
  .page{justify-self:center}
  .toc{display:block;position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;font-size:13px;padding-right:8px}
  .toc h6{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted)}
  .toc a{display:block;text-decoration:none;color:var(--muted);padding:3px 8px;border-radius:5px;line-height:1.35}
  .toc a.l3{padding-left:18px}
  .toc a:hover{background:var(--hover);color:var(--fg)}
  .toc a.on{color:var(--fg);font-weight:600;background:var(--hover)}
}

/* ---------- reading column (fragments) ---------- */
.unit{font-family:var(--f-read);font-size:var(--fs);line-height:1.68;color:var(--fg)}
.unit .eyebrow{display:none}
.unit h1,.unit h2,.unit h3,.unit h4{font-family:var(--f-ui);color:var(--fg);text-wrap:balance;line-height:1.25;letter-spacing:-.01em}
.unit h1{font-size:2.2em;font-weight:700;margin:8px 0 10px;letter-spacing:-.022em}
.unit h2{font-size:1.5em;font-weight:700;margin:2.4em 0 .6em}
.unit h3{font-size:1.17em;font-weight:650;margin:2em 0 .5em}
.unit h4{font-size:1em;font-weight:650;margin:1.5em 0 .4em}
.unit p{margin:.55em 0 .9em}
.unit ul,.unit ol{padding-left:1.4em;margin:.4em 0 1em}
.unit li{margin:.28em 0}
.unit li::marker{color:var(--muted)}
.unit strong,.unit b{font-weight:650}
.unit a{color:var(--accent);text-underline-offset:3px}
.unit .lede{font-size:1.08em;color:var(--fg2);margin-top:0}
ul.syl{list-style:none;padding:12px 16px;margin:18px 0;background:var(--t-gray);border-radius:8px;font-size:.88em;line-height:1.55;color:var(--fg2);columns:2 260px;column-gap:28px}
ul.syl li{break-inside:avoid;padding-left:14px;position:relative;margin:2px 0}
ul.syl li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}

.formula{background:var(--t-gray);border-radius:8px;padding:12px 18px;margin:18px 0;overflow-x:auto}
.formula .where{font-size:.86em;color:var(--fg2);margin:6px 0 0;text-align:left}
.mjx-cache{position:absolute;width:0;height:0;overflow:hidden}
.mi svg{display:inline;max-width:none}
.md{display:block;text-align:center;margin:6px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.md svg{max-width:none}

.unit aside{border-radius:8px;padding:12px 16px;margin:18px 0;font-size:.93em;line-height:1.6;background:var(--t-gray)}
.unit aside.note{background:var(--t-blue)} .unit aside.tip{background:var(--t-green)} .unit aside.warn{background:var(--t-yellow)} .unit aside.exam{background:var(--t-orange)} .unit aside.real{background:var(--t-purple)}
aside > b:first-child,aside > p:first-child > b:first-child{display:block;margin-bottom:2px;font-family:var(--f-ui);font-size:.92em;letter-spacing:.01em}
aside.note > b:first-child{color:var(--i-blue)} aside.tip > b:first-child{color:var(--i-green)} aside.warn > b:first-child{color:var(--i-yellow)} aside.exam > b:first-child{color:var(--i-orange)} aside.real > b:first-child{color:var(--i-purple)}
.unit aside > :first-child{margin-top:0} .unit aside > :last-child{margin-bottom:0}

.tbl{overflow-x:auto;margin:18px 0}
.tbl table{border-collapse:collapse;font-size:.86em;min-width:100%;font-family:var(--f-ui);line-height:1.45}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 12px 8px 0;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:.92em}
.tbl tr:last-child td{border-bottom:0}

figure{margin:24px 0}
.fig{border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;background:var(--bg)}
.fig svg{display:block;width:100%;min-width:520px;height:auto;color:var(--fg)}
figcaption{font-family:var(--f-ui);font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.photo{max-width:640px}
.photo img{display:block;width:100%;height:auto;border-radius:10px;background:var(--t-gray)}
.credit{display:block;font-size:11.5px;margin-top:2px;opacity:.85}
svg .ln{stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg .thin{stroke-width:1.2} svg .thick{stroke-width:3.2}
svg .dash{stroke-dasharray:7 5} svg .hid{stroke-dasharray:14 4 3 4;stroke-width:1.2}
svg .acc{stroke:var(--i-blue)} svg .acc2{stroke:var(--i-orange)}
svg .fill-soft{fill:var(--t-gray)} svg .fill-acc{fill:var(--t-blue)} svg .fill-acc2{fill:var(--t-orange)}
svg .fill-hatch{fill:url(#hatch)}
svg .solid{fill:currentColor;stroke:none}
svg .lbl,svg .lbl-sm,svg .lbl-b,svg .lbl-acc{fill:currentColor;stroke:none;font-family:var(--f-ui);font-size:15px}
svg .lbl-sm{font-size:12.5px} svg .lbl-b{font-weight:700} svg .lbl-acc{fill:var(--i-blue);font-weight:600}
svg text.ln{stroke:none;fill:currentColor}
#hatch path{stroke:var(--muted);stroke-width:1.2}

/* questions & numericals */
article.q,article.num{border-top:1px solid var(--line);padding:18px 0 6px;margin:0}
.part > article.q:first-of-type,.part > article.num:first-of-type{border-top:0}
article.q h3,article.num h3{margin:0 0 6px;font-size:1.04em;font-weight:650;line-height:1.4}
.q-src{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin:0 0 6px!important}
.q-hint{font-size:.9em;color:var(--fg2);margin:0 0 8px!important}
details.answer{margin:8px 0 6px;border-radius:8px}
details.answer>summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--f-ui);font-weight:600;font-size:14px;color:var(--fg2);padding:4px 8px 4px 4px;border-radius:6px;list-style:none;user-select:none}
details.answer>summary::-webkit-details-marker{display:none}
details.answer>summary::before{content:"";width:0;height:0;border-left:6px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;transition:transform .15s ease-out;margin:0 4px 0 6px}
details.answer[open]>summary::before{transform:rotate(90deg)}
details.answer>summary:hover{background:var(--hover);color:var(--fg)}
details.answer[open]{background:none}
details.answer>:not(summary){margin-left:22px}
.method{background:var(--t-blue);border-radius:8px;padding:12px 16px;font-size:.93em}
ol.steps{counter-reset:st;list-style:none;padding-left:0;margin:10px 0}
ol.steps>li{counter-increment:st;position:relative;padding:6px 0 6px 40px;margin:0}
ol.steps>li::before{content:counter(st);position:absolute;left:4px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--t-gray);font-family:var(--f-ui);font-size:12px;font-weight:600;display:grid;place-items:center;color:var(--fg2)}
ol.steps>li.hide{display:none}
.final{font-family:var(--f-ui);font-weight:650;font-size:.95em;background:var(--t-green);border-radius:8px;padding:10px 14px;margin:12px 0 4px!important}
.final.hide{display:none}
.stepbar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
article.num.practice h3{font-weight:600}

/* buttons used inside content */
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--f-ui);font-size:13.5px;font-weight:500;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;line-height:1.3;transition:background .12s}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--press)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--t-blue);border-color:transparent;color:var(--i-blue)}

/* quiz + cards */
.quiz{display:grid;gap:12px;margin:28px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.quiz::before{content:"Self-check";font-family:var(--f-ui);font-weight:700;font-size:1.17em}
.mcq{padding:2px 0}
.mcq .stem{margin:0 0 8px!important;font-weight:600}
.mcq ol.opts{list-style:none;padding:0;margin:0;display:grid;gap:6px;counter-reset:op}
.mcq ol.opts li{counter-increment:op;border:1px solid var(--line);border-radius:8px;padding:7px 12px 7px 40px;cursor:pointer;position:relative;margin:0;font-size:.95em;transition:background .12s,border-color .12s}
.mcq ol.opts li::before{content:counter(op,lower-alpha);position:absolute;left:14px;top:7px;font-family:var(--f-ui);font-weight:600;color:var(--muted)}
.mcq ol.opts li:hover{background:var(--hover)}
.mcq.answered ol.opts li{cursor:default}
.mcq ol.opts li.right{background:var(--t-green);border-color:transparent}
.mcq ol.opts li.right::before{color:var(--i-green)}
.mcq ol.opts li.wrong{background:var(--t-red);border-color:transparent}
.mcq ol.opts li.wrong::before{color:var(--i-red)}
.mcq .why{display:none;font-size:.9em;color:var(--fg2);margin:8px 0 0!important}
.mcq.answered .why{display:block}
.qfoot{display:flex;align-items:center;gap:12px}
.qscore{font-family:var(--f-ui);font-size:14px;color:var(--fg2);font-variant-numeric:tabular-nums}
dl.cards{display:none}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:20px 0}
.fcard{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:14px;min-height:118px;cursor:pointer;text-align:left;font-family:var(--f-ui);font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:6px;transition:background .15s,border-color .15s}
.fcard:hover{background:var(--hover)}
.fcard b{font-size:15px;font-weight:650}
.fcard .hintx{font-size:12px;color:var(--muted);margin-top:auto}
.fcard.flip{background:var(--t-blue);border-color:transparent}

/* widgets */
.widget{border:1px solid var(--line);border-radius:12px;padding:16px;margin:26px 0;font-family:var(--f-ui);font-size:14px;line-height:1.45;background:var(--bg)}
.widget h5{margin:0 0 12px;font-size:14px;font-weight:650;color:var(--fg)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;margin-bottom:12px}
.wgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.wgrid input,.wgrid select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);font-size:14px;width:100%;font-variant-numeric:tabular-nums}
.wgrid input:focus,.wgrid select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
.wout{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 14px;font-size:13.5px;background:var(--t-gray);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums}
.wout b{font-weight:600;color:var(--fg2)}
.wsvg{overflow-x:auto;margin-top:12px}
.wsvg svg{display:block;width:100%;min-width:480px;height:auto;color:var(--fg)}
.wbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.wnote{font-size:12.5px;color:var(--muted);margin-top:10px}

/* ---------- properties (tracker inside the page) ---------- */
.props{margin:4px 0 22px;font-family:var(--f-ui);font-size:14px}
.prow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;padding:5px 0;align-items:center}
.prow .k{color:var(--muted);display:flex;align-items:center;gap:7px}
.prow .v{color:var(--fg);display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.pill.ok{background:var(--t-green);color:var(--i-green)} .pill.warn{background:var(--t-yellow);color:var(--i-yellow)}
.pill.bad{background:var(--t-red);color:var(--i-red)} .pill.run{background:var(--t-blue);color:var(--i-blue)}
.sections{margin:10px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) auto 84px auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}

.srow .tm{font-variant-numeric:tabular-nums;color:var(--fg2);font-size:13.5px;white-space:nowrap}
.bar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}

.bar.over i{background:var(--i-red)} .bar.done i{background:var(--i-green)}

.runbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 10px 3px 8px;font-size:13px;cursor:pointer;min-width:84px;justify-content:center}

.runbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* floating timer */

.timer .what{min-width:0;flex:0 1 auto}
.timer .over{color:var(--i-red)}
@keyframes rise{from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes pulse{50%{opacity:.35}}

.daygrp{margin:18px 0 0}
.daygrp h3{font-size:14px;font-weight:650;margin:0 0 6px;display:flex;gap:10px;align-items:baseline}

.table{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 92px 128px 92px 26px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<svg width="0" height="0" aria-hidden="true" focusable="false" class="hatchdefs" style="position:absolute"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 V8"/></pattern></defs></svg>

<script>
"use strict";
const DATA=/*UNITS*/null;
const SUBJ=DATA.subjects; const UNITS=DATA.units;
const SORDER=["sm","te","mse","mt"];
const SCOL={sm:"var(--sm)",te:"var(--te)",mse:"var(--mse)",mt:"var(--mt)"};
const SSHORT={sm:"SoM",te:"Thermal",mse:"MSE",mt:"MT"};
const PNAME={concepts:"Concepts",theory:"Theory Qs",numericals:"Numericals"};
const ITEMS=[]; UNITS.forEach(u=>Object.keys(u.targets).forEach(p=>ITEMS.push({id:u.id+"-"+p,unit:u,part:p,target:u.targets[p],due:u.due})));
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k==="text")e.textContent=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}kids.flat().forEach(k=>k!=null&&e.append(k));return e;};
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());};
const fmtDate=iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});};
const dayDiff=(a,b)=>{const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5);};
const hm=ms=>{const s=Math.max(0,Math.round(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`;};
const mins=ms=>Math.round(ms/60000);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ================= tracker state ================= */
let TR=LS.get("notes.tracker",{});           // id -> {ms, startedAt, done, doneAt}
let db=null, col=null; const chains={};
function st(id){return TR[id]||{ms:0,startedAt:null,done:false,doneAt:null};}
function used(id){const s=st(id);return s.ms+(s.startedAt?Date.now()-s.startedAt:0);}
function persist(id){
  LS.set("notes.tracker",TR);
  if(!col) return;
  const body={...st(id)}; body.updated=Date.now();
  chains[id]=(chains[id]||Promise.resolve()).then(()=>col.doc(id).set(body)).then(()=>setSync("Saved")).catch(e=>{
    setSync(e&&e.code==="invalid_argument"?"Read-only: saved on this device":"Not saved online — kept on this device");});
}
function startItem(id){
  for(const k in TR){ if(TR[k].startedAt && k!==id) stopItem(k); }
  const s={...st(id)}; if(s.startedAt) return; s.startedAt=Date.now(); TR[id]=s; persist(id); refreshTracker();
}
function stopItem(id){
  const s={...st(id)}; if(!s.startedAt) return; s.ms+=Date.now()-s.startedAt; s.startedAt=null; TR[id]=s; persist(id); refreshTracker();
}
function toggleDone(id,on){
  const s={...st(id)}; if(s.startedAt){s.ms+=Date.now()-s.startedAt;s.startedAt=null;}
  s.done=on; s.doneAt=on?Date.now():null; TR[id]=s; persist(id); refreshTracker();
}
function status(it){
  const s=st(it.id), u=used(it.id), T=it.target*60000, today=todayISO();
  if(s.done) return u<=T?{c:"ok",t:"Done on time"}:{c:"warn",t:`Done, ${mins(u-T)} min over`};
  if(s.startedAt) return u>T?{c:"bad",t:`Running, ${mins(u-T)} min over`}:{c:"run",t:"Running"};
  if(today>it.due) return {c:"bad",t:"Overdue"};
  if(u>T) return {c:"warn",t:`${mins(u-T)} min over`};
  if(today===it.due) return {c:"warn",t:"Due today"};
  if(u>0) return {c:"run",t:"In progress"};
  return {c:"",t:"Not started"};
}
function dotClass(it){const s=st(it.id);if(s.done)return used(it.id)<=it.target*60000?"d":"w";if(todayISO()>it.due)return "o";if(used(it.id)>0)return "p";return "";}

async function initDB(){
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){db=null;}
  if(!db){setSync("Tracker saves on this device only");return;}
  col=db.collection("tracker");
  const timer=setTimeout(()=>setSync("Cannot reach saved progress yet"),10000);
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(timer);
    snap.docs.forEach(d=>{ if(d.exists){ const v=d.data(); TR[d.id]={ms:v.ms||0,startedAt:v.startedAt||null,done:!!v.done,doneAt:v.doneAt||null}; } });
    LS.set("notes.tracker",TR);
    setSync(snap.metadata.fromCache?"Progress from cache":"Progress synced");
    refreshTracker();
  },err=>{clearTimeout(timer);col=null;setSync("Tracker saves on this device only");});
}

/* ================= icons + helpers ================= */
const IC={
 chev:'<svg class="ico sm chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8.5A3.5 3.5 0 0 1 18 7.5V20H9.5A3.5 3.5 0 0 1 6 16.5z"/><path d="M6 16.5A3.5 3.5 0 0 1 9.5 13H18"/></svg>',
 home:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>',
 cal:'<svg class="ico sm" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
 flag:'<svg class="ico sm" viewBox="0 0 24 24"><path d="M6 21V4h11l-2.5 4 2.5 4H6"/></svg>',
 book2:'<svg class="ico sm" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>'
};
const frag=s=>{const t=document.createElement("template");t.innerHTML=s.trim();return t.content.firstChild;};
function setSync(t){const s=$("#sync");if(!s)return;const ok=/synced|Saved/.test(t),warn=/device|reach|Read-only|Not saved|cache/.test(t);s.className="sync"+(ok?" ok":warn?" warn":"");$(".txt",s).textContent=t;s.title=t;}
function unitSvg(u){
  const ps=Object.keys(u.targets).map(p=>ITEMS.find(i=>i.id===u.id+"-"+p));
  const d=ps.filter(i=>st(i.id).done).length,f=d/ps.length,late=ps.some(i=>!st(i.id).done&&todayISO()>i.due);
  if(f===1)return '<svg class="st done" viewBox="0 0 16 16" aria-label="complete"><circle cx="8" cy="8" r="6.5"/><path d="m5 8.3 2 2 4-4.3"/></svg>';
  let pie="";
  if(f>0){const a=2*Math.PI*f,x=8+6.5*Math.sin(a),y=8-6.5*Math.cos(a);pie=`<path class="part" d="M8 8 L8 1.5 A6.5 6.5 0 ${f>.5?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z"/>`;}
  else if(ps.some(i=>used(i.id)>0)) pie='<circle class="part" cx="8" cy="8" r="2.4" style="stroke:none"/>';
  return `<svg class="st${late?" late":""}" viewBox="0 0 16 16" aria-label="${late?"overdue":d+" of "+ps.length+" done"}"><circle cx="8" cy="8" r="6.5"/>${pie}</svg>`;
}
const leftTxt=n=>n>1?`${n} days left`:n===1?"tomorrow":n===0?"today":"finished";

/* ================= routing ================= */
let route="home", curUnit=null, pendingScroll=null, io=null;
function parseHash(){const h=(location.hash||"").replace(/^#/,"");if(!h||h==="home")return "home";if(SUBJ[h]){const us=UNITS.filter(u=>u.subject===h);const nxt=us.find(u=>Object.keys(u.targets).some(p=>!st(u.id+"-"+p).done))||us[0];return nxt.id;}if(UNITS.some(u=>u.id===h))return h;return "home";}
function go(){route=parseHash();curUnit=route==="home"?null:UNITS.find(u=>u.id===route);renderSide();renderCrumbs();if(curUnit)showUnit(curUnit);else showHome();renderTimer();window.scrollTo(0,0);}
window.addEventListener("hashchange",go);

/* ================= sidebar + breadcrumb ================= */
const OPEN=LS.get("notes.navOpen",{sm:true,te:true,mse:true,mt:true});
function renderSide(){
  const s=$("#side");s.innerHTML="";
  s.append(frag(`<a class="brand" href="#home"><span class="logo">${IC.book}</span>III Sem Mech Notes</a>`));
  s.append(frag(`<a class="nav-item${route==="home"?" cur":""}" href="#home">${IC.home}<span>Study tracker</span></a>`));
  SORDER.forEach(sj=>{
    const its=ITEMS.filter(i=>i.unit.subject===sj),dn=its.filter(i=>st(i.id).done).length;
    const g=el("div",{class:"nav-group"+(OPEN[sj]?"":" closed")});
    const hd=frag(`<button class="nav-head" type="button" aria-expanded="${!!OPEN[sj]}">${IC.chev}<span></span><span class="cnt">${dn}/${its.length}</span></button>`);
    hd.children[1].textContent=SUBJ[sj].name;
    hd.addEventListener("click",()=>{OPEN[sj]=!OPEN[sj];LS.set("notes.navOpen",OPEN);g.classList.toggle("closed",!OPEN[sj]);hd.setAttribute("aria-expanded",!!OPEN[sj]);});
    const box=el("div",{class:"nav-units"});
    UNITS.filter(u=>u.subject===sj).forEach(u=>{
      const a=frag(`<a class="nav-item${curUnit&&curUnit.id===u.id?" cur":""}" href="#${u.id}" data-u="${u.id}"><span class="u">U${u.n}</span><span style="flex:1;min-width:0"></span>${unitSvg(u)}</a>`);
      a.children[1].textContent=u.title;if(curUnit&&curUnit.id===u.id)a.setAttribute("aria-current","page");box.append(a);
    });
    g.append(hd,box);s.append(g);
  });
  s.append(el("div",{class:"side-foot",text:"Progress saves to your claude.ai account. Target times and due dates come from your Finals Plan."}));
}
function renderCrumbs(){
  const c=$("#crumbs");c.innerHTML="";
  if(!curUnit){c.append(el("span",{class:"here",text:"Study tracker"}));return;}
  c.append(el("a",{href:"#"+curUnit.subject,text:SUBJ[curUnit.subject].name}),el("span",{text:"/","aria-hidden":"true"}),el("span",{class:"here",text:`Unit ${curUnit.n} · ${curUnit.title}`}));
}

/* ================= properties block (tracker in the unit) ================= */
function prow(ic,k,v,id){const r=el("div",{class:"prow"});const kk=el("span",{class:"k"});kk.innerHTML=ic;kk.append(document.createTextNode(k));const vv=el("span",{class:"v"});if(id)vv.id=id;if(v)vv.textContent=v;r.append(kk,vv);return r;}
function propsBlock(u){
  const w=el("div",{class:"props",id:"props"});
  w.append(prow(IC.book2,"Subject",`${SUBJ[u.subject].name} · ${SUBJ[u.subject].code}`),prow(IC.cal,"Due",null,"pDue"),
           prow(IC.flag,"Exam",`${fmtDate(SUBJ[u.subject].exam)} · ${leftTxt(dayDiff(todayISO(),SUBJ[u.subject].exam))}`));
  const sec=el("div",{class:"sections"});
  Object.keys(u.targets).forEach(p=>{
    const id=u.id+"-"+p, r=el("div",{class:"srow",id:"sr-"+id});
    const ck=frag(`<button class="chk" type="button" role="checkbox" aria-checked="false" aria-label="Mark ${PNAME[p]} done">${IC.check}</button>`);
    ck.addEventListener("click",()=>toggleDone(id,!st(id).done));
    const nm=el("a",{class:"nm",href:"#"+u.id,text:PNAME[p]});
    nm.addEventListener("click",e=>{e.preventDefault();const s=document.getElementById(id);if(s)s.scrollIntoView({behavior:"smooth"});});
    const rb=el("button",{class:"runbtn",type:"button"});rb.addEventListener("click",()=>st(id).startedAt?stopItem(id):startItem(id));

    let micro;if(c<ce){const pf=(ce-c)/(ce-ca);micro=[["Pro-eutectoid ferrite",pf],["Pearlite",1-pf]];}else{const pc=(c-ce)/(cc-ce);micro=[["Pro-eutectoid Fe₃C",pc],["Pearlite",1-pc]];}
    micro.forEach(([n,v])=>rows.push([n+" =",f3(v*100)+" %"]));outRows(b.out,rows);
    const s=svgBox(b.pic,620,330);arrowDefs(s,"wlr-a");const X=x=>70+x/2.2*500,Y=t=>300-(t-600)/(1200-600)*270;
    s.append(sv("line",{x1:70,y1:300,x2:600,y2:300,class:"ln","marker-end":"url(#wlr-a)"}),sv("line",{x1:70,y1:300,x2:70,y2:20,class:"ln","marker-end":"url(#wlr-a)"}),sv("text",{x:520,y:322,class:"lbl"},"wt % C"),sv("text",{x:76,y:30,class:"lbl"},"T (°C)"),
      sv("path",{d:`M${X(0)} ${Y(912)} L${X(0.8)} ${Y(727)} L${X(2.1)} ${Y(1147)}`,class:"ln"}),sv("line",{x1:X(0.022),y1:Y(727),x2:X(2.2),y2:Y(727),class:"ln"}),sv("path",{d:`M${X(0)} ${Y(912)} L${X(0.022)} ${Y(727)}`,class:"ln thin"}),
      sv("text",{x:X(0.85),y:Y(727)+18,class:"lbl-sm"},"727 °C, 0.8 % C (eutectoid)"),sv("text",{x:X(0.15),y:Y(1050),class:"lbl"},"γ (austenite)"),sv("text",{x:X(0.15),y:Y(800),class:"lbl-sm"},"α + γ"),sv("text",{x:X(1.3),y:Y(860),class:"lbl-sm"},"γ + Fe₃C"),sv("text",{x:X(0.9),y:Y(660),class:"lbl-sm"},"α + Fe₃C (pearlite + …)"),
      sv("line",{x1:X(c),y1:300,x2:X(c),y2:30,class:"ln acc dash"}),sv("line",{x1:X(0.022),y1:Y(715),x2:X(2.2),y2:Y(715),class:"ln acc2 thick"}),sv("circle",{cx:X(c),cy:Y(715),r:6,class:"solid"}),sv("text",{x:X(c)+6,y:Y(1180),class:"lbl-acc"},"C₀ = "+f3(c)+" %"));
    [0,0.8,2].forEach(v=>s.append(sv("text",{x:X(v)-8,y:318,class:"lbl-sm"},String(v))));});
  w.append(el("p",{class:"wnote",text:"Eutectoid at 0.8 % C (teacher's value; some books use 0.76 %). Phase fractions use the tie line from 0.022 % C (ferrite) to 6.67 % C (cementite)."}));},

merchant(w){const b=wbase(w,"Try it · Merchant circle (orthogonal cutting)",[{k:"Fc",l:"Cutting force Fc (N)",v:1200},{k:"Ft",l:"Thrust force Ft (N)",v:500},{k:"al",l:"Rake angle α (°)",v:10},{k:"t1",l:"Uncut chip t₁ (mm)",v:0.3},{k:"t2",l:"Chip thickness t₂ (mm)",v:0.6},{k:"V",l:"Cutting speed V (m/min)",v:30}]);
  b.on(()=>{const Fc=b.get("Fc"),Ft=b.get("Ft"),al=b.get("al")*Math.PI/180,r=b.get("t1")/b.get("t2"),V=b.get("V");const ph=Math.atan(r*Math.cos(al)/(1-r*Math.sin(al)));
    const F=Fc*Math.sin(al)+Ft*Math.cos(al),N=Fc*Math.cos(al)-Ft*Math.sin(al),mu=F/N,be=Math.atan(mu),Fs=Fc*Math.cos(ph)-Ft*Math.sin(ph),Fn=Fc*Math.sin(ph)+Ft*Math.cos(ph),R=Math.hypot(Fc,Ft);
    outRows(b.out,[["r = t₁/t₂ =",f3(r)],["φ = tan⁻¹[r cosα/(1 − r sinα)] =",f3(ph*180/Math.PI)+"°"],["F = Fc sinα + Ft cosα =",f3(F)+" N"],["N = Fc cosα − Ft sinα =",f3(N)+" N"],["μ = F/N =",f3(mu)+" (β = "+f3(be*180/Math.PI)+"°)"],["Fs = Fc cosφ − Ft sinφ =",f3(Fs)+" N"],["Fn = Fc sinφ + Ft cosφ =",f3(Fn)+" N"],["R =",f3(R)+" N"],["Chip velocity Vc = rV =",f3(r*V)+" m/min"],["Shear velocity Vs =",f3(V*Math.cos(al)/Math.cos(ph-al))+" m/min"]]);
    const s=svgBox(b.pic,600,380);arrowDefs(s,"wme-a");const k=300/R,O=[150,40],P=(x,y)=>[O[0]+x*k,O[1]+y*k],Q=P(Fc,Ft);const C=[(O[0]+Q[0])/2,(O[1]+Q[1])/2];
    s.append(sv("circle",{cx:C[0],cy:C[1],r:R*k/2,class:"ln thin dash"}));
    const seg=(a,bb,cls,lab,dx=6,dy=-6)=>{s.append(sv("line",{x1:a[0],y1:a[1],x2:bb[0],y2:bb[1],class:"ln "+cls,"marker-end":"url(#wme-a)"}));if(lab)s.append(sv("text",{x:(a[0]+bb[0])/2+dx,y:(a[1]+bb[1])/2+dy,class:"lbl-sm"},lab));};
    const proj=(u)=>{const d=Fc*u[0]+Ft*u[1];return P(d*u[0],d*u[1]);};
    seg(O,P(Fc,0),"thick","Fc",0,-8);seg(P(Fc,0),Q,"thick","Ft",8,0);seg(O,Q,"","R",-26,8);
    const pf=proj([Math.sin(al),Math.cos(al)]);seg(O,pf,"acc","F",-24,0);seg(pf,Q,"acc","N",0,16);
    const ps=proj([Math.cos(ph),-Math.sin(ph)]);seg(O,ps,"acc2","Fs",0,-8);seg(ps,Q,"acc2","Fn",8,0);
    s.append(sv("circle",{cx:O[0],cy:O[1],r:4,class:"solid"}),sv("text",{x:O[0]-30,y:O[1]-6,class:"lbl-sm"},"tool tip"));});}
};
